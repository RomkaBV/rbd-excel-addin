<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  >

  <title>РБД — Нова заявка</title>

  <!-- Для майбутньої роботи всередині Excel Online -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>

    /* =========================================================
       БАЗОВІ НАЛАШТУВАННЯ
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #eef5fb 0%,
          #f7f9fc 100%
        );

      color: #17324d;

      min-height: 100%;
    }


    body {
      padding: 18px;
    }


    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }


    /* =========================================================
       ВЕРХНЯ ШАПКА
       ========================================================= */

    .header {
      position: relative;

      overflow: hidden;

      border-radius: 16px;

      padding: 22px 22px 20px;

      margin-bottom: 16px;

      background:
        linear-gradient(
          135deg,
          #123c68 0%,
          #175a92 60%,
          #2876ad 100%
        );

      color: white;

      box-shadow:
        0 8px 24px
        rgba(20, 70, 110, 0.18);
    }


    .header::after {
      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      border-radius: 50%;

      right: -75px;
      top: -85px;

      background:
        rgba(255,255,255,0.08);
    }


    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }


    .brand-icon {
      width: 44px;
      height: 44px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.14);

      border:
        1px solid
        rgba(255,255,255,0.20);

      font-size: 24px;

      flex-shrink: 0;
    }


    .header-title {
      margin: 0;

      font-size: 22px;

      font-weight: 700;

      letter-spacing:
        -0.3px;
    }


    .header-subtitle {
      margin-top: 5px;

      font-size: 13px;

      color:
        rgba(255,255,255,0.82);
    }


    /* =========================================================
       ОСНОВНА КАРТКА
       ========================================================= */

    .card {
      background: #ffffff;

      border:
        1px solid #dfe8f1;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 6px 22px
        rgba(22, 61, 94, 0.08);
    }


    .card-header {
      display: flex;

      align-items: center;

      gap: 12px;

      padding:
        19px 20px;

      border-bottom:
        1px solid #e8eef5;

      background:
        linear-gradient(
          180deg,
          #ffffff,
          #fbfdff
        );
    }


    .card-icon {
      width: 38px;
      height: 38px;

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eaf4ff;

      color: #1469ad;

      font-size: 20px;
    }


    .card-title {
      margin: 0;

      font-size: 18px;

      font-weight: 700;

      color: #113f70;
    }


    .card-description {
      margin-top: 3px;

      font-size: 12px;

      color: #708399;
    }


    .form-body {
      padding: 20px;
    }


    /* =========================================================
       ПОЛЯ
       ========================================================= */

    .field {
      margin-bottom: 17px;
    }


    .grid-2 {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 14px;
    }


    label {
      display: flex;

      align-items: center;

      gap: 6px;

      margin-bottom: 7px;

      font-size: 12.5px;

      font-weight: 650;

      color: #153e63;
    }


    .label-icon {
      color: #1670b8;

      font-size: 14px;

      width: 17px;

      text-align: center;
    }


    .required {
      color: #d83232;
    }


    input,
    select,
    textarea {

      width: 100%;

      border:
        1px solid #cbd8e6;

      border-radius: 9px;

      background: #ffffff;

      color: #24374b;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 13px;

      padding:
        10px 12px;

      outline: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }


    input,
    select {
      height: 42px;
    }


    textarea {
      min-height: 92px;

      resize: vertical;

      line-height: 1.45;
    }


    input::placeholder,
    textarea::placeholder {
      color: #95a4b5;
    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color: #2780be;

      box-shadow:
        0 0 0 3px
        rgba(39, 128, 190, 0.11);

      background: #ffffff;
    }


    /* Обов'язкові поля */

    .required-field {
      background:
        linear-gradient(
          90deg,
          #fffdf3,
          #fff8db
        );

      border-color:
        #e4d6a2;
    }


    .required-field:focus {
      background: #fffdf5;

      border-color: #d7b74c;

      box-shadow:
        0 0 0 3px
        rgba(215, 183, 76, 0.12);
    }


    /* =========================================================
       СУМА
       ========================================================= */

    .money-box {
      position: relative;
    }


    .money-box input {
      padding-right: 48px;
    }


    .currency {
      position: absolute;

      right: 12px;
      top: 50%;

      transform:
        translateY(-50%);

      font-size: 12px;

      color: #6c8096;

      pointer-events: none;
    }


    /* =========================================================
       ПІДКАЗКА
       ========================================================= */

    .hint {
      display: flex;

      align-items: flex-start;

      gap: 9px;

      background: #f3f8fc;

      border:
        1px solid #d8e7f3;

      border-radius: 10px;

      padding: 11px 12px;

      margin:
        2px 0 18px;

      font-size: 11.5px;

      line-height: 1.45;

      color: #60758a;
    }


    .hint-icon {
      color: #2679b8;

      font-size: 15px;
    }


    /* =========================================================
       КНОПКИ
       ========================================================= */

    .actions {
      display: grid;

      grid-template-columns:
        minmax(0, 2fr)
        minmax(120px, 1fr);

      gap: 12px;

      margin-top: 6px;
    }


    button {
      height: 46px;

      border-radius: 9px;

      border: none;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease;
    }


    .primary-button {

      background:
        linear-gradient(
          135deg,
          #109149,
          #18ac5b
        );

      color: white;

      box-shadow:
        0 5px 14px
        rgba(16, 145, 73, 0.22);
    }


    .primary-button:hover {

      background:
        linear-gradient(
          135deg,
          #0c813f,
          #149c50
        );

      box-shadow:
        0 7px 17px
        rgba(16, 145, 73, 0.28);

      transform:
        translateY(-1px);
    }


    .secondary-button {

      background: #ffffff;

      color: #536b82;

      border:
        1px solid #cdd8e3;
    }


    .secondary-button:hover {

      background: #f7fafc;

      border-color: #aebdca;
    }


    /* =========================================================
       ПОВІДОМЛЕННЯ
       ========================================================= */

    .message {

      display: none;

      margin-top: 14px;

      padding:
        11px 13px;

      border-radius: 9px;

      font-size: 12px;

      font-weight: 600;
    }


    .message.success {

      display: block;

      background: #e7f8ee;

      border:
        1px solid #b8e7ca;

      color: #14733b;
    }


    .message.error {

      display: block;

      background: #fff0f0;

      border:
        1px solid #f1c0c0;

      color: #a52e2e;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      padding: 13px 20px;

      border-top:
        1px solid #edf1f5;

      background: #fafcfe;

      color: #8393a3;

      font-size: 10.5px;

      display: flex;

      justify-content:
        space-between;

      gap: 10px;
    }


    .system-status {
      color: #1a8b4a;

      font-weight: 600;
    }


    /* =========================================================
       TASK PANE / MOBILE
       ========================================================= */

    @media
    (max-width: 520px) {

      body {
        padding: 10px;
      }


      .header {
        padding: 17px;
      }


      .header-title {
        font-size: 18px;
      }


      .grid-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }


      .actions {
        grid-template-columns: 1fr;
      }


      .form-body {
        padding: 16px;
      }


      .card-header {
        padding: 16px;
      }

    }

  </style>
</head>


<body>

  <div class="app">


    <!-- =======================================================
         HEADER
         ======================================================= -->

    <header class="header">

      <div class="brand-row">

        <div class="brand-icon">
          🏢
        </div>

        <div>

          <h1 class="header-title">
            РБД — Кабінет керівника
          </h1>

          <div class="header-subtitle">
            Створення нової заявки
          </div>

        </div>

      </div>

    </header>


    <!-- =======================================================
         FORM CARD
         ======================================================= -->

    <section class="card">

      <div class="card-header">

        <div class="card-icon">
          📄
        </div>

        <div>

          <h2 class="card-title">
            Нова заявка
          </h2>

          <div class="card-description">
            Заповніть інформацію для створення заявки в системі РБД
          </div>

        </div>

      </div>


      <div class="form-body">


        <!-- SD + CATEGORY -->

        <div class="grid-2">

          <div class="field">

            <label for="sd">

              <span class="label-icon">
                #
              </span>

              Номер заявки SD

            </label>

            <input
              id="sd"
              type="text"
              placeholder="Наприклад: SD-123456"
            >

          </div>


          <div class="field">

            <label for="category">

              <span class="label-icon">
                ◆
              </span>

              Категорія

              <span class="required">
                *
              </span>

            </label>

            <select
              id="category"
              class="required-field">

              <option value="">
                Оберіть категорію...
              </option>

              <!-- JS додасть довідник -->

            </select>

          </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="field">

          <label for="description">

            <span class="label-icon">
              ≡
            </span>

            Опис

            <span class="required">
              *
            </span>

          </label>

          <textarea
            id="description"
            class="required-field"
            maxlength="500"
            placeholder="Опишіть необхідні роботи, деталі та важливі примітки...">
          </textarea>

        </div>


        <!-- CITY + ADDRESS -->

        <div class="grid-2">

          <div class="field">

            <label for="city">

              <span class="label-icon">
                ●
              </span>

              Місто

              <span class="required">
                *
              </span>

            </label>

            <select
              id="city"
              class="required-field">

              <option value="">
                Оберіть місто...
              </option>

              <!-- JS додасть міста -->

            </select>

          </div>


          <div class="field">

            <label for="address">

              <span class="label-icon">
                ▦
              </span>

              Адреса / локація

            </label>

            <input
              id="address"
              type="text"
              placeholder="Наприклад: вул. Хрещатик, 1"
            >

          </div>

        </div>


        <!-- AMOUNT + DATE -->

        <div class="grid-2">

          <div class="field">

            <label for="amount">

              <span class="label-icon">
                ₴
              </span>

              Сума витрат

            </label>

            <div class="money-box">

              <input
                id="amount"
                type="number"
                min="0"
                step="0.01"
                placeholder="0,00"
              >

              <span class="currency">
                грн
              </span>

            </div>

          </div>


          <div class="field">

            <label for="plannedDate">

              <span class="label-icon">
                ▣
              </span>

              Планова дата завершення

            </label>

            <input
              id="plannedDate"
              type="date"
            >

          </div>

        </div>


        <!-- CUSTOMER + EXECUTOR -->

        <div class="grid-2">

          <div class="field">

            <label for="customer">

              <span class="label-icon">
                ●
              </span>

              Замовник

              <span class="required">
                *
              </span>

            </label>

            <input
              id="customer"
              class="required-field"
              type="text"
              placeholder="ПІБ або підрозділ"
            >

          </div>


          <div class="field">

            <label for="executor">

              <span class="label-icon">
                ●●
              </span>

              Виконавець

              <span class="required">
                *
              </span>

            </label>

            <select
              id="executor"
              class="required-field">

              <option value="">
                Оберіть виконавця...
              </option>

              <!-- JS додасть виконавців -->

            </select>

          </div>

        </div>


        <!-- COMMENT -->

        <div class="field">

          <label for="comment">

            <span class="label-icon">
              ▣
            </span>

            Коментар

          </label>

          <textarea
            id="comment"
            maxlength="300"
            placeholder="Додаткова інформація за потреби...">
          </textarea>

        </div>


        <!-- HINT -->

        <div class="hint">

          <div class="hint-icon">
            ⓘ
          </div>

          <div>
            Поля, позначені
            <strong>*</strong>,
            є обов'язковими.
            Дата створення, ID та початковий статус
            будуть сформовані системою автоматично.
          </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

          <button
            id="createButton"
            class="primary-button"
            type="button">

            ➤ СТВОРИТИ ЗАЯВКУ

          </button>


          <button
            id="clearButton"
            class="secondary-button"
            type="button">

            Очистити

          </button>

        </div>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message">
        </div>


      </div>


      <!-- FOOTER -->

      <div class="footer">

        <span>
          РБД — система управління заявками
        </span>

        <span class="system-status">
          ● Готово
        </span>

      </div>

    </section>


  </div>


  <!-- =========================================================
       ТИМЧАСОВО:
       JS до Excel ще не підключаємо.
       Поки працює тільки кнопка "Очистити".
       ========================================================= -->

  <script>

    const clearButton =
      document.getElementById(
        "clearButton"
      );


    clearButton.addEventListener(
      "click",
      function () {

        const ids = [
          "sd",
          "category",
          "description",
          "city",
          "address",
          "amount",
          "plannedDate",
          "customer",
          "executor",
          "comment"
        ];


        ids.forEach(
          function (id) {

            const element =
              document.getElementById(id);

            if (element) {
              element.value = "";
            }

          }
        );


        const message =
          document.getElementById(
            "message"
          );


        message.className =
          "message";

        message.textContent =
          "";

      }
    );


    document
      .getElementById(
        "createButton"
      )
      .addEventListener(
        "click",
        function () {

          const message =
            document.getElementById(
              "message"
            );


          message.className =
            "message success";

          message.textContent =
            "✓ Візуальна форма готова. Підключення до Excel додамо наступним кроком.";

        }
      );

  </script>


</body>
</html>
